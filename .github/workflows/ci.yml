name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# All CI runs share one Neon test branch. Serialize so migrations and
# fixtures don't collide between parallel jobs. When we outgrow this,
# swap to a per-PR Neon branch via the Neon GitHub App.
concurrency:
  group: ci-neon-test-branch
  cancel-in-progress: false

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Write .env.test from secrets
        run: |
          cat > .env.test <<EOF
          DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}
          PG_APP_USER=${{ secrets.TEST_PG_APP_USER }}
          PG_APP_PASSWORD=${{ secrets.TEST_PG_APP_PASSWORD }}
          NODE_ENV=test
          JWT_SECRET=ci-only-jwt-secret-not-for-production-use
          ADMIN_SECRET=ci-only-admin-secret
          DEFAULT_TENANT_ID=
          EOF

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci
