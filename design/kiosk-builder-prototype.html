<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Juanberto's — Kiosk Builder Prototype</title>
<style>
  /* ─── Talavera Terracotta palette (mirrors kiosk/src/index.css) ─── */
  :root {
    --n-50:  #F5F1E8; --n-100: #EBE4D5; --n-200: #D7CDB9; --n-300: #B9AF9B;
    --n-400: #968C7A; --n-500: #736B5C; --n-600: #524C40; --n-700: #3C3730;
    --n-800: #2A2A2A; --n-900: #15120E; --n-950: #0A0A0A;
    --brand-100: #F0DCCB; --brand-200: #E0B598; --brand-300: #CF8E65;
    --brand-400: #C0743F; --brand-500: #AD6432; --brand-600: #A8542A;
    --brand-700: #8A4321; --brand-800: #693219; --brand-900: #452010;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--n-950); color: var(--n-50);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* ─── Chrome ─── */
  header.bar {
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--n-800);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-shrink: 0;
  }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--n-500); margin: 0 0 2px; }
  h1.screen-title { font-size: clamp(22px, 4.5vw, 40px); font-weight: 900; margin: 0; line-height: 1.05; }
  .bar-right { display: flex; gap: 8px; flex-shrink: 0; }
  .chip {
    height: 44px; padding: 0 14px; border-radius: 10px; border: none;
    background: var(--n-800); color: var(--n-50);
    font-size: 14px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:active { background: var(--n-700); }
  .chip.brand { background: var(--brand-600); }

  /* ─── Progress dots ─── */
  .steps { display: flex; gap: 6px; padding: 10px 16px 0; flex-shrink: 0; }
  .steps span { height: 5px; flex: 1; border-radius: 3px; background: var(--n-800); transition: background .25s; }
  .steps span.done { background: var(--brand-600); }

  main.body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }

  footer.bar {
    padding: 12px 16px max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--n-800); flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;
  }

  /* ─── Buttons ─── */
  .btn {
    min-height: 56px; border-radius: 14px; border: none; cursor: pointer;
    font-size: 18px; font-weight: 900; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .08s; width: 100%; padding: 12px 20px;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--brand-600); }
  .btn.primary:disabled { background: var(--n-800); color: var(--n-500); cursor: default; }
  .btn.ghost { background: var(--n-800); }
  .btn.outline { background: transparent; border: 2px solid var(--n-700); color: var(--n-100); }
  .btn.split { justify-content: space-between; }
  .btn small { font-weight: 700; font-size: 14px; opacity: .8; }

  /* ─── Attract screen ─── */
  .attract {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    gap: 20px; text-align: center; padding: 24px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: radial-gradient(ellipse at 50% 120%, var(--brand-900) 0%, var(--n-950) 60%);
  }
  .attract .logo { font-size: clamp(30px, 6vw, 60px); font-weight: 900; letter-spacing: -.02em; line-height: 1; }
  .attract .logo em { font-style: normal; color: var(--brand-300); }
  .attract .tag { font-size: clamp(14px, 2.6vw, 19px); font-weight: 700; color: var(--n-300); margin: 4px 0 0; }
  .attract .big {
    min-height: 80px; font-size: clamp(19px, 3.6vw, 28px); max-width: 640px;
    box-shadow: 0 12px 40px rgba(168,84,42,.35); flex-shrink: 0;
  }
  .attract .side { max-width: 640px; min-height: 60px; font-size: 17px; flex-shrink: 0; }
  .fav-label {
    font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
    color: var(--brand-300); margin: 4px 0 0;
  }
  .fav-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    width: 100%; max-width: 640px;
  }
  @media (min-width: 640px) { .fav-grid { grid-template-columns: repeat(3, 1fr); } }
  .preset {
    background: var(--n-900); border: 2px solid var(--n-800); border-radius: 14px;
    padding: 12px 10px; cursor: pointer; color: var(--n-50); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform .08s, border-color .15s;
  }
  .preset:active { transform: scale(.95); border-color: var(--brand-400); }
  .preset .ico { font-size: 30px; line-height: 1; }
  .preset .nm { font-size: 15px; font-weight: 900; line-height: 1.1; }
  .preset .sb { font-size: 11px; font-weight: 700; color: var(--n-400); }
  .preset .pr { font-size: 14px; font-weight: 800; color: var(--brand-300); }
  .or-div {
    display: flex; align-items: center; gap: 12px; width: 100%; max-width: 640px;
    color: var(--n-500); font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
  }
  .or-div::before, .or-div::after { content: ''; flex: 1; height: 1px; background: var(--n-800); }

  /* ─── Preset quick-question overlay (e.g. Breakfast: ¿Con chorizo?) ─── */
  .ask-overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.82);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .ask-box {
    background: var(--n-900); border: 1px solid var(--n-800); border-radius: 24px;
    width: 100%; max-width: 440px; padding: 28px 24px; text-align: center;
    display: flex; flex-direction: column; gap: 16px;
  }
  .ask-box .big-ico { font-size: 52px; line-height: 1; }
  .ask-box h2 { margin: 0; font-size: 28px; font-weight: 900; }
  .ask-box .sub2 { margin: -8px 0 0; font-size: 14px; font-weight: 700; color: var(--n-400); }

  /* ─── Name entry (call-out name) ─── */
  .name-wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .name-display {
    min-height: 76px; border-radius: 16px; background: var(--n-900); border: 2px solid var(--n-700);
    display: flex; align-items: center; justify-content: center; padding: 12px 18px;
    font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: .04em;
  }
  .name-display .caret { display: inline-block; width: 3px; height: 1em; background: var(--brand-400); margin-left: 4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .kb { display: flex; flex-direction: column; gap: 8px; }
  .kb-row { display: flex; gap: 6px; justify-content: center; }
  .key {
    flex: 1; max-width: 64px; min-height: 54px; border-radius: 10px; border: none;
    background: var(--n-800); color: var(--n-50); font-size: 20px; font-weight: 900;
    cursor: pointer; font-family: inherit; touch-action: manipulation;
  }
  .key:active { background: var(--brand-600); }
  .key.wide { max-width: none; flex: 3; font-size: 14px; letter-spacing: .1em; }

  /* ─── Done / loyalty screen ─── */
  .done {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px; overflow-y: auto;
    background: radial-gradient(ellipse at 50% -20%, var(--brand-900) 0%, var(--n-950) 55%);
  }
  .done .check {
    width: 84px; height: 84px; border-radius: 50%; background: var(--brand-600);
    display: flex; align-items: center; justify-content: center; font-size: 44px;
    box-shadow: 0 12px 40px rgba(168,84,42,.4); flex-shrink: 0;
  }
  .done h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); font-weight: 900; }
  .done .call { margin: 0; font-size: clamp(15px, 3vw, 20px); font-weight: 700; color: var(--n-300); max-width: 520px; }
  .loyalty-card {
    background: var(--n-900); border: 1px solid var(--n-800); border-radius: 20px;
    padding: 20px; display: flex; align-items: center; gap: 18px; max-width: 520px; width: 100%;
    text-align: left; flex-shrink: 0;
  }
  .loyalty-card .qr {
    width: 132px; height: 132px; background: #fff; border-radius: 12px; padding: 8px; flex-shrink: 0;
  }
  .loyalty-card h3 { margin: 0 0 6px; font-size: 18px; font-weight: 900; color: var(--brand-300); }
  .loyalty-card p { margin: 0; font-size: 14px; font-weight: 600; color: var(--n-300); line-height: 1.45; }

  /* ─── Card grids ─── */
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); padding-bottom: 8px; }
  @media (min-width: 640px)  { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .card {
    background: var(--n-900); border: 2px solid var(--n-800); border-radius: 16px;
    padding: 18px 14px; cursor: pointer; text-align: center; color: var(--n-50);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    min-height: 132px; justify-content: center; position: relative;
    transition: transform .08s, border-color .15s, background .15s;
    font-family: inherit;
  }
  .card:active { transform: scale(.96); }
  .card.on { border-color: var(--brand-400); background: var(--brand-900); }
  .card .ico { font-size: clamp(34px, 6vw, 48px); line-height: 1; }
  .card .nm { font-size: clamp(15px, 2.6vw, 19px); font-weight: 900; line-height: 1.15; }
  .card .pr { font-size: clamp(14px, 2.4vw, 17px); font-weight: 800; color: var(--brand-300); }
  .card .qty {
    position: absolute; top: -8px; right: -8px; min-width: 28px; height: 28px; border-radius: 14px;
    background: var(--brand-600); color: #fff; font-weight: 900; font-size: 15px;
    display: flex; align-items: center; justify-content: center; padding: 0 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }

  /* ─── Style cards ─── */
  .style-wrap { display: grid; gap: 14px; grid-template-columns: 1fr; max-width: 900px; margin: 0 auto; }
  @media (min-width: 700px) { .style-wrap { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1024px) { .style-wrap { grid-template-columns: 1fr 1fr 1fr; max-width: 1200px; } }
  .style-card {
    background: var(--n-900); border: 3px solid var(--n-800); border-radius: 20px;
    padding: 24px 20px; cursor: pointer; text-align: left; color: var(--n-50);
    transition: transform .08s, border-color .15s, background .15s; font-family: inherit; width: 100%;
  }
  .style-card:active { transform: scale(.97); }
  .style-card.on { border-color: var(--brand-400); background: var(--brand-900); box-shadow: 0 8px 30px rgba(168,84,42,.25); }
  .style-card h3 { margin: 0 0 4px; font-size: clamp(22px, 4vw, 30px); font-weight: 900; }
  .style-badge {
    display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px;
    font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
  }
  .style-badge.burrito { background: var(--brand-600); color: #fff; }
  .style-badge.nob { background: var(--n-800); color: var(--n-100); border: 1px solid var(--n-600); }
  .style-card .sub { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-300); margin: 0 0 12px; }
  .style-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .style-card li {
    background: var(--n-800); border-radius: 999px; padding: 6px 12px;
    font-size: clamp(13px, 2.3vw, 15px); font-weight: 700; color: var(--n-100);
  }
  .style-card.on li { background: var(--brand-800); }

  /* ─── Modify (remove) rows ─── */
  .rows { display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin: 0 auto; }
  .row-t {
    background: var(--n-900); border: 2px solid var(--n-800); border-radius: 14px;
    min-height: 60px; padding: 10px 16px; cursor: pointer; color: var(--n-50);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-family: inherit; font-size: 17px; font-weight: 800; text-align: left;
    transition: border-color .15s, background .15s;
  }
  .row-t .lbl { display: flex; align-items: center; gap: 12px; }
  .row-t .ico { font-size: 26px; }
  .row-t.off { border-color: var(--brand-500); background: var(--brand-900); }
  .row-t.off .lbl { text-decoration: line-through; color: var(--brand-200); }
  .row-t .state { font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--n-500); }
  .row-t.off .state { color: var(--brand-300); }
  .hint { text-align: center; color: var(--n-400); font-weight: 700; font-size: 14px; margin: 0 0 14px; }

  /* ─── Section headers in add-ons ─── */
  .sect { font-size: 13px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--n-400); margin: 18px 0 10px; }
  .sect:first-child { margin-top: 0; }

  /* ─── Summary ─── */
  .sum { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .sum-item { background: var(--n-900); border: 1px solid var(--n-800); border-radius: 16px; padding: 16px; }
  .sum-item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .sum-item .top b { font-size: 18px; font-weight: 900; }
  .sum-item .top span { font-weight: 900; color: var(--brand-300); font-size: 17px; }
  .sum-item .mods { margin: 6px 0 0; font-size: 14px; color: var(--n-300); font-weight: 600; line-height: 1.5; }
  .sum-item .mods .rm { color: var(--brand-300); }
  .sum-item .rowbtns { display: flex; gap: 8px; margin-top: 12px; }
  .mini { height: 40px; padding: 0 14px; border-radius: 10px; border: none; background: var(--n-800); color: var(--n-100); font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit; }
  .total-line { display: flex; justify-content: space-between; font-size: 22px; font-weight: 900; padding: 4px 6px; }
  .total-line span:last-child { color: var(--brand-300); }

  .fade { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .note {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--brand-600); color: #fff; font-weight: 900; padding: 10px 20px; border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); font-size: 15px; opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 50; white-space: nowrap;
  }
  .note.show { opacity: 1; }

  .proto-tag {
    position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
    color: var(--n-600); pointer-events: none; z-index: 60;
  }
</style>
</head>
<body>
<div class="proto-tag">Prototipo · v11</div>
<div id="app"></div>
<div class="note" id="note"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   EDIT ME — all menu data lives here. Prices in MXN.
   Prices pulled from the live juanbertos.com menu where they exist;
   chorizo & bacon burritos are NEW items → placeholder prices, adjust!
   ═══════════════════════════════════════════════════════════════════ */
const PROTEINS = [
  { id:'asada',      ico:'🐮', price:250, es:'Carne Asada',  en:'Carne Asada' },
  { id:'pollo',      ico:'🐔', price:219, es:'Pollo Asado',  en:'Grilled Chicken' },
  { id:'porkbelly',  ico:'🐷', price:230, es:'Porkbelly',    en:'Pork Belly' },
  { id:'huevo',      ico:'🍳', price:180, es:'Huevo',        en:'Eggs' },
  /* chorizo is hidden from the builder grid (v8) — it exists only as the
     Breakfast "¿Con chorizo?" add-on, but stays here so pricing/names resolve.
     If a guest backs into the protein screen with it selected, it shows. */
  { id:'chorizo',    ico:'🌶️', price:195, es:'Chorizo',      en:'Chorizo', hidden:true },  // placeholder price
  { id:'portobello', ico:'🍄', price:170, es:'Portobello',   en:'Portobello' },
  { id:'camaron',    ico:'🦐', price:240, es:'Camarón',      en:'Shrimp' },
  { id:'pescado',    ico:'🐟', price:265, es:'Pescado',      en:'Baja Fish' },
];
/* birria & cochinita are NOT builder proteins — they live only as the fixed
   $99 house favorites El Tijuana / Yucatán on the start screen (v6). */

/* Two-protein combos: max 2 proteins per burrito.
   COMBO_PRICES = combos Juan has priced manually. Key = the two protein ids
   in alphabetical order joined with '+'. Any combo NOT listed here falls back
   to: price of the pricier protein + COMBO_FALLBACK_ADDON (so the prototype
   always shows a price). Add lines here as you decide real combo prices. */
const COMBO_PRICES = {
  'asada+camaron': 340,   // real: Surf-N-Turf on the current menu
  'chorizo+huevo': 210,   // placeholder — breakfast con chorizo, set real price
};
const COMBO_FALLBACK_ADDON = 90;  // placeholder rule for unpriced combos
const MAX_PROTEINS = 2;

function proteinPrice(ids){
  if (!ids || !ids.length) return 0;
  const ps = ids.map(id => PROTEINS.find(x => x.id === id));
  if (ids.length === 1) return ps[0].price;
  const key = [...ids].sort().join('+');
  if (key in COMBO_PRICES) return COMBO_PRICES[key];
  return Math.max(ps[0].price, ps[1].price) + COMBO_FALLBACK_ADDON;
}

const STYLES = {
  california: {
    es:'California Style', en:'California Style',
    subEs:'El clásico de San Diego', subEn:'The San Diego classic',
    ing: [
      { id:'papas', ico:'🍟', es:'Papas a la francesa', en:'French fries' },
      { id:'queso', ico:'🧀', es:'Queso',               en:'Cheese' },
      { id:'guac',  ico:'🥑', es:'Guacamole',           en:'Guacamole' },
      { id:'pico',  ico:'🍅', es:'Pico de gallo',       en:'Pico de gallo' },
      { id:'crema', ico:'🥛', es:'Crema',               en:'Sour cream' },
    ],
  },
  mission: {
    es:'Mission Style', en:'Mission Style',
    subEs:'Al estilo San Francisco', subEn:'San Francisco style',
    ing: [
      { id:'arroz',    ico:'🍚', es:'Arroz',         en:'Rice' },
      { id:'frijoles', ico:'🫘', es:'Frijoles',      en:'Beans' },
      { id:'queso',    ico:'🧀', es:'Queso',         en:'Cheese' },
      { id:'guac',     ico:'🥑', es:'Guacamole',     en:'Guacamole' },
      { id:'pico',     ico:'🍅', es:'Pico de gallo', en:'Pico de gallo' },
      { id:'crema',    ico:'🥛', es:'Crema',         en:'Sour cream' },
    ],
  },
  fries: {
    es:'Fries', en:'Fries',
    subEs:'Tu proteína sobre papas — sin tortilla', subEn:'Your protein over fries — no tortilla',
    ing: [
      { id:'papas',    ico:'🍟', es:'Papas a la francesa',  en:'French fries' },
      { id:'guac',     ico:'🥑', es:'Guacamole',            en:'Guacamole' },
      { id:'pico',     ico:'🍅', es:'Pico de gallo',        en:'Pico de gallo' },
      { id:'crema',    ico:'🥛', es:'Crema',                en:'Sour cream' },
      { id:'frijoles', ico:'🫘', es:'Frijoles (opcional)',  en:'Beans (optional)' },
    ],
  },
};

/* Fries-style pricing: the menu prices fries entrées per protein, not as a
   flat markup (Carne Asada/Chorizo/Porkbelly Fries $299, Birria Fries $269).
   Key = protein id, or 'idA+idB' (alphabetical) for a two-protein fries.
   Unlisted → protein/combo price + FRIES_FALLBACK_ADDON. */
const FRIES_PRICES = {
  'asada': 299, 'chorizo': 299, 'porkbelly': 299,  // real menu prices
};
const FRIES_FALLBACK_ADDON = 49;  // matches asada: 250 → 299

function stylePrice(ids, styleKey){
  const base = proteinPrice(ids);
  if (styleKey !== 'fries' || !ids || !ids.length) return base;
  const key = [...ids].sort().join('+');
  if (key in FRIES_PRICES) return FRIES_PRICES[key];
  return base + FRIES_FALLBACK_ADDON;
}

/* House favorites shown on the start screen. Tapping one pre-fills the
   wizard (proteins + style) and lands on the style screen, where the guest
   confirms "Así está bien" or modifies. Price always comes from the same
   protein/combo pricing engine — no separate preset prices to maintain. */
const PRESETS = [
  { id:'california',  ico:'🌊', proteins:['asada'],            style:'california', es:'El California',   en:'The California' },
  { id:'pollos',      ico:'🐔', proteins:['pollo'],            style:'mission',    es:'Pollos Hermanos', en:'Pollos Hermanos' },
  /* `ask` = one-tap question after tapping the card: offer a second protein
     (most Breakfast customers add chorizo). Both answers land on style/confirm. */
  { id:'breakfast',   ico:'🍳', proteins:['huevo'],            style:'california', es:'Breakfast',       en:'Breakfast', ask:{ protein:'chorizo' } },
  { id:'surfnturf',   ico:'🦐', proteins:['asada','camaron'],  style:'mission',    es:'Surf-N-Turf',     en:'Surf-N-Turf' },
  /* Fixed-price house items (not builder-backed): tapping adds straight to the
     order at this price, then flows into "¿Deseas agregar algo?".

    doneBody:'Listen for your name — we’ll call you when your order is ready.',
    loyaltyTitle:'Earn points with this order',
    loyaltyBody:'Scan the QR to join Juanberto’s loyalty: stamps with every purchase and a free burrito.',
    newOrder:'New order',
  },
};

/* ─── state (in-memory only) ─── */
let lang = 'es';
let screen = 'attract';           // attract | protein | style | modify | addons | summary | name | done
let draft = null;                  // { proteins, style, removed:Set, extras:{} }
let cart = [];                     // committed burritos + loose items
let editIndex = null;              // when editing an existing cart line
let customerName = '';             // call-out name, captured before payment

const $ = (s) => document.querySelector(s);
const t = (k) => T[lang][k];
const mxn = (n) => '$' + n.toFixed(0);
const name = (o) => lang === 'es' ? o.es : o.en;

function toast(msg){
  const n = $('#note'); n.textContent = msg; n.classList.add('show');
  clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('show'), 1200);
}

function go(s){ screen = s; render(); }

function newDraft(){ draft = { proteins:[], style:null, removed:new Set(), extras:{} }; }

function draftPrice(d){
  const p = stylePrice(d.proteins, d.style);
  const ex = Object.entries(d.extras).reduce((s,[id,q]) => {
    const it = EXTRAS.find(x => x.id === id); return s + (it ? it.price * q : 0);
  }, 0);
  return p + ex;
}
function cartTotal(){
  return cart.reduce((s,l) => s + (l.kind === 'burrito' ? draftPrice(l) : l.price * l.qty), 0);
}
function looseAdd(item, kind){
  const found = cart.find(l => l.kind === kind && l.id === item.id);
  if (found) found.qty += 1;
  else cart.push({ kind, id:item.id, es:item.es, en:item.en, ico:item.ico, price:item.price, qty:1 });
  toast(t('added') + ' ' + name(item));
  render();
}

/* ─── renderers ─── */
function render(){
  const app = $('#app');
  app.innerHTML = '';
  const fn = { attract:rAttract, protein:rProtein, style:rStyle, modify:rModify, addons:rAddons, summary:rSummary, name:rName, done:rDone }[screen];
  fn(app);
}

function chrome(app, { kicker, title, step, backTo }){
  const hdr = document.createElement('header'); hdr.className = 'bar';
  hdr.innerHTML = `
    <div style="min-width:0">
      <p class="kicker">${kicker}</p>
      <h1 class="screen-title">${title}</h1>
    </div>
    <div class="bar-right">
      <button class="chip" id="langBtn">${lang === 'es' ? 'EN' : 'ES'}</button>
      ${backTo ? `<button class="chip" id="backBtn">← ${t('back')}</button>` : ''}
    </div>`;
  app.appendChild(hdr);
  hdr.querySelector('#langBtn').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; render(); };
  if (backTo) hdr.querySelector('#backBtn').onclick = () => go(backTo);
  if (step) {
    const dots = document.createElement('div'); dots.className = 'steps';
    dots.innerHTML = [1,2,3,4].map(i => `<span class="${i <= step ? 'done' : ''}"></span>`).join('');
    app.appendChild(dots);
  }
  const main = document.createElement('main'); main.className = 'body fade';
  app.appendChild(main);
  return main;
}

function footerBtns(app, btns){
  const f = document.createElement('footer'); f.className = 'bar';
  for (const b of btns){
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || 'primary') + (b.split ? ' split' : '');
    el.innerHTML = b.html; el.disabled = !!b.disabled; el.onclick = b.on;
    f.appendChild(el);
  }
  app.appendChild(f);
}

/* 0 · Attract: house favorites (pre-filled wizard) + blank builder + drinks */
function rAttract(app){
  const d = document.createElement('div'); d.className = 'attract fade';
  const styleName = (key) => lang === 'es' ? STYLES[key].es : STYLES[key].en;
  d.innerHTML = `
    <div>
      <div class="logo">JUANBERTO<em>'S</em></div>
      <p class="tag">${lang === 'es' ? 'La regla no se rompe: papas adentro.' : 'The rule stands: fries inside.'}</p>
    </div>
    <p class="fav-label">${t('favorites')}</p>
    <div class="fav-grid">
      ${PRESETS.map(p => `
        <button class="preset" data-p="${p.id}">
          <span class="ico">${p.ico}</span>
          <span class="nm">${name(p)}</span>
          <span class="sb">${p.fixed
            ? (lang === 'es' ? p.subEs : p.subEn)
            : p.proteins.map(id => name(PROTEINS.find(x => x.id === id))).join(' + ') + ' · ' + styleName(p.style).replace(' Style','')}</span>
          <span class="pr">${mxn(p.fixed ? p.price : stylePrice(p.proteins, p.style))}</span>
        </button>`).join('')}
    </div>
    <div class="or-div">${lang === 'es' ? 'o' : 'or'}</div>
    <button class="btn primary big" id="go">🌯 ${t('start')}<br><small>${t('startSub')}</small></button>
    <button class="btn outline side" id="dr">🥤 ${t('drinksJump')}</button>
    <button class="chip" id="lg">${lang === 'es' ? 'English' : 'Español'}</button>`;
  app.appendChild(d);
  d.querySelectorAll('.preset').forEach(el => {
    el.onclick = () => {
      const p = PRESETS.find(x => x.id === el.dataset.p);
      if (p.fixed){
        if (p.choice){ showFixedChoice(d, p); return; }
        // Fixed house item: straight to the order, then the add-something upsell.
        looseAdd(p, 'preset');
        draft = null; editIndex = null;
        go('addons_only');
        return;
      }
      if (p.ask){ showPresetAsk(d, p); return; }
      startPreset(p, p.proteins);
    };
  });
  $('#go').onclick = () => { newDraft(); editIndex = null; go('protein'); };
  $('#dr').onclick = () => go('addons_only');
  $('#lg').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; render(); };
}

function startPreset(p, proteins){
  newDraft(); editIndex = null;
  draft.proteins = [...proteins];
  draft.style = p.style;
  go('style');   // land on style screen, pre-selected → "Así está bien" / modify
}

/* One-tap question after tapping a preset with `ask` (e.g. Breakfast → chorizo).
   The "with" option leads since most guests take it; price delta comes from the
   same combo pricing engine. */
function showPresetAsk(container, p){
  const extra = PROTEINS.find(x => x.id === p.ask.protein);
  const withPrice = proteinPrice([...p.proteins, extra.id]);
  const delta = withPrice - proteinPrice(p.proteins);
  const ov = document.createElement('div'); ov.className = 'ask-overlay fade';
  ov.innerHTML = `
    <div class="ask-box">
      <span class="big-ico">${p.ico}${extra.ico}</span>
      <h2>${lang === 'es' ? `¿Con ${name(extra).toLowerCase()}?` : `Add ${name(extra).toLowerCase()}?`}</h2>
      <p class="sub2">${name(p)}</p>
      <button class="btn primary split" id="askYes">
        <span>${lang === 'es' ? `Con ${name(extra).toLowerCase()}` : `With ${name(extra).toLowerCase()}`}</span>
        <small>+${mxn(delta)} · ${mxn(withPrice)}</small>
      </button>
      <button class="btn ghost split" id="askNo">
        <span>${lang === 'es' ? `Sin ${name(extra).toLowerCase()}` : `Without ${name(extra).toLowerCase()}`}</span>
        <small>${mxn(proteinPrice(p.proteins))}</small>
      </button>
      <button class="chip" id="askBack">${t('back')}</button>
    </div>`;
  container.appendChild(ov);
  ov.querySelector('#askYes').onclick = () => startPreset(p, [...p.proteins, extra.id]);
  ov.querySelector('#askNo').onclick = () => startPreset(p, p.proteins);
  ov.querySelector('#askBack').onclick = () => ov.remove();
}

/* Required either/or pop-up for a fixed item with `choice` (e.g. Rollbertos:
   birria or cochinita — same price, guest must pick one). */
function showFixedChoice(container, p){
  const ov = document.createElement('div'); ov.className = 'ask-overlay fade';
  ov.innerHTML = `
    <div class="ask-box">
      <span class="big-ico">${p.ico}</span>
      <h2>${lang === 'es' ? p.choice.qEs : p.choice.qEn}</h2>
      <p class="sub2">${name(p)} · ${lang === 'es' ? p.subEs : p.subEn} · ${mxn(p.price)}</p>
      ${p.choice.options.map((o, i) => `
        <button class="btn primary split" data-o="${i}">
          <span>${o.ico} ${name(o)}</span>
          <small>${mxn(p.price)}</small>
        </button>`).join('')}
      <button class="chip" id="chBack">${t('back')}</button>
    </div>`;
  container.appendChild(ov);
  ov.querySelectorAll('[data-o]').forEach(btn => {
    btn.onclick = () => {
      const o = p.choice.options[Number(btn.dataset.o)];
      looseAdd({
        id: p.id + '-' + o.id,
        ico: p.ico,
        price: p.price,
        es: `${p.es} ${o.es.toLowerCase()}`,
        en: `${p.en} — ${o.en.toLowerCase()}`,
      }, 'preset');
      draft = null; editIndex = null;
      go('addons_only');
    };
  });
  ov.querySelector('#chBack').onclick = () => ov.remove();
}

/* 1 · Protein (multi-select, max 2) */
function rProtein(app){
  const main = chrome(app, { kicker:t('stepProteinK'), title:t('stepProtein'), step:1, backTo:null });
  const hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = t('proteinHint');
  main.appendChild(hint);
  const g = document.createElement('div'); g.className = 'grid';
  const visible = PROTEINS.filter(p => !p.hidden || draft.proteins.includes(p.id));
  for (const p of visible){
    const on = draft.proteins.includes(p.id);
    const c = document.createElement('button');
    c.className = 'card' + (on ? ' on' : '');
    c.innerHTML = `${on ? `<span class="qty">✓</span>` : ''}<span class="ico">${p.ico}</span><span class="nm">${name(p)}</span><span class="pr">${mxn(p.price)}</span>`;
    c.onclick = () => {
      if (on) draft.proteins = draft.proteins.filter(id => id !== p.id);
      else if (draft.proteins.length >= MAX_PROTEINS){ toast(t('maxProteins')); return; }
      else draft.proteins.push(p.id);
      render();
    };
    g.appendChild(c);
  }
  main.appendChild(g);
  const n = draft.proteins.length;
  const label = n
    ? `<span>${t('continue')}${n === 2 ? ' · ' + t('comboTag') : ''}</span><small>${mxn(proteinPrice(draft.proteins))}</small>`
    : t('proteinPick');
  footerBtns(app, [
    { html:label, cls:'primary', split:!!n, disabled:!n, on:() => go('style') },
    { html:`← ${t('startOver')}`, cls:'ghost', on:() => { newDraft(); go('attract'); } },
  ]);
}

/* 2 · Style */
function rStyle(app){
  const main = chrome(app, { kicker:t('stepStyleK'), title:t('stepStyle'), step:2, backTo:'protein' });
  const wrap = document.createElement('div'); wrap.className = 'style-wrap';
  const icons = { california:'🌊', mission:'🌉', fries:'🍟' };
  for (const key of Object.keys(STYLES)){
    const s = STYLES[key];
    const price = stylePrice(draft.proteins, key);
    const isBurrito = key !== 'fries';
    const badge = isBurrito
      ? `<span class="style-badge burrito">🌯 Burrito</span>`
      : `<span class="style-badge nob">${lang === 'es' ? '🍟 Solo papas · NO es burrito' : '🍟 Just fries · NOT a burrito'}</span>`;
    const c = document.createElement('button');
    c.className = 'style-card' + (draft.style === key ? ' on' : '');
    c.innerHTML = `
      ${badge}
      <h3>${icons[key]} ${name(s)} <span style="float:right;color:var(--brand-300)">${mxn(price)}</span></h3>
      <p class="sub">${lang === 'es' ? s.subEs : s.subEn}</p>
      <ul>${s.ing.map(i => `<li>${i.ico} ${name(i)}</li>`).join('')}</ul>`;
    c.onclick = () => { draft.style = key; draft.removed = new Set(); render(); };
    wrap.appendChild(c);
  }
  main.appendChild(wrap);
  footerBtns(app, [
    { html:t('asIs'), cls:'primary', disabled:!draft.style, on:() => go('addons') },
    { html:t('modify'), cls:'ghost', disabled:!draft.style, on:() => go('modify') },
  ]);
}

/* 3 · Modify (removals) */
function rModify(app){
  const main = chrome(app, { kicker:t('stepModifyK'), title:t('stepModify'), step:3, backTo:'style' });
  const hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = t('modifyHint');
  main.appendChild(hint);
  const rows = document.createElement('div'); rows.className = 'rows';
  for (const ing of STYLES[draft.style].ing){
    const off = draft.removed.has(ing.id);
    const r = document.createElement('button');
    r.className = 'row-t' + (off ? ' off' : '');
    r.innerHTML = `
      <span class="lbl"><span class="ico">${ing.ico}</span>${name(ing)}</span>
      <span class="state">${off ? t('without') : t('withIt')}</span>`;
    r.onclick = () => {
      off ? draft.removed.delete(ing.id) : draft.removed.add(ing.id);
      render();
    };
    rows.appendChild(r);
  }
  main.appendChild(rows);
  footerBtns(app, [{ html:t('continue'), cls:'primary', on:() => go('addons') }]);
}

/* 4 · Add-ons (also serves the drinks&sides jump when draft === null) */
function rAddons(app){
  const jumpMode = !draft;
  const main = chrome(app, {
    kicker: jumpMode ? '' : t('stepAddK'),
    title: jumpMode ? t('drinksJump').replace('Solo b','B').replace('Just d','D') : t('stepAdd'),
    step: jumpMode ? 0 : 4,
    backTo: jumpMode ? 'attract' : (draft.removed && draft.removed.size ? 'modify' : 'style'),
  });

  const addSection = (label, items, kind) => {
    const h = document.createElement('p'); h.className = 'sect'; h.textContent = label;
    main.appendChild(h);
    const g = document.createElement('div'); g.className = 'grid';
    for (const it of items){
      const qty = kind === 'extra'
        ? (draft ? (draft.extras[it.id] || 0) : 0)
        : (cart.find(l => l.kind === kind && l.id === it.id)?.qty || 0);
      const c = document.createElement('button');
      c.className = 'card' + (qty ? ' on' : '');
      c.innerHTML = `${qty ? `<span class="qty">×${qty}</span>` : ''}
        <span class="ico">${it.ico}</span><span class="nm">${name(it)}</span><span class="pr">+${mxn(it.price)}</span>`;
      c.onclick = () => {
        if (kind === 'extra' && draft){ draft.extras[it.id] = (draft.extras[it.id] || 0) + 1; toast(t('added') + ' ' + name(it)); render(); }
        else looseAdd(it, kind);
      };
      g.appendChild(c);
    }
    main.appendChild(g);
  };

  if (!jumpMode) addSection(t('extras'), EXTRAS, 'extra');
  addSection(t('sides'), SIDES, 'side');
  addSection(t('drinks'), DRINKS, 'drink');

  const done = () => {
    if (draft){
      if (editIndex !== null){ cart[editIndex] = { kind:'burrito', ...draft }; editIndex = null; }
      else cart.push({ kind:'burrito', ...draft });
      draft = null;
    }
    go('summary');
  };
  footerBtns(app, [{
    html: draft || cart.length ? `<span>${t('continue')}</span><small>${t('total')}: ${mxn(cartTotal() + (draft ? draftPrice(draft) : 0))}</small>` : t('skip'),
    cls:'primary', split: !!(draft || cart.length), on: done,
  }]);
}

/* 5 · Summary */
function rSummary(app){
  const main = chrome(app, { kicker:t('orderK'), title:t('yourOrder'), step:0, backTo:null });
  const wrap = document.createElement('div'); wrap.className = 'sum';

  if (!cart.length){
    const p = document.createElement('p'); p.className = 'hint'; p.textContent = t('emptyCart');
    wrap.appendChild(p);
  }

  cart.forEach((line, i) => {
    const d = document.createElement('div'); d.className = 'sum-item';
    if (line.kind === 'burrito'){
      const protNames = line.proteins.map(id => name(PROTEINS.find(p => p.id === id))).join(' + ');
      const st = STYLES[line.style];
      const removed = [...line.removed].map(id => {
        const ing = st.ing.find(x => x.id === id); return ing ? `<span class="rm">${t('without').toLowerCase()} ${name(ing).toLowerCase()}</span>` : '';
      }).filter(Boolean);
      const extras = Object.entries(line.extras).map(([id,q]) => {
        const e = EXTRAS.find(x => x.id === id); return e ? `+ ${name(e)}${q > 1 ? ' ×' + q : ''}` : '';
      }).filter(Boolean);
      d.innerHTML = `
        <div class="top"><b>${line.style === 'fries' ? '🍟 ' + protNames + ' Fries' : '🌯 ' + t('burrito') + ' ' + protNames + ' · ' + name(st)}</b><span>${mxn(draftPrice(line))}</span></div>
        ${removed.length || extras.length ? `<p class="mods">${[...removed, ...extras].join(' · ')}</p>` : ''}
        <div class="rowbtns">
          <button class="mini" data-e="${i}">${t('edit')}</button>
          <button class="mini" data-x="${i}">${t('remove')}</button>
        </div>`;
    } else {
      d.innerHTML = `
        <div class="top"><b>${line.ico} ${name(line)}${line.qty > 1 ? ' ×' + line.qty : ''}</b><span>${mxn(line.price * line.qty)}</span></div>
        <div class="rowbtns"><button class="mini" data-x="${i}">${t('remove')}</button></div>`;
    }
    wrap.appendChild(d);
  });

  if (cart.length){
    const tot = document.createElement('div'); tot.className = 'total-line';
    tot.innerHTML = `<span>${t('total')}</span><span>${mxn(cartTotal())}</span>`;
    wrap.appendChild(tot);
  }
  main.appendChild(wrap);

  main.addEventListener('click', (ev) => {
    const e = ev.target.closest('[data-e]'); const x = ev.target.closest('[data-x]');
    if (e){
      const line = cart[Number(e.dataset.e)];
      draft = { proteins:[...line.proteins], style:line.style, removed:new Set(line.removed), extras:{ ...line.extras } };
      editIndex = Number(e.dataset.e);
      go('protein');
    } else if (x){
      cart.splice(Number(x.dataset.x), 1); render();
    }
  });

  footerBtns(app, [
    { html:t('anotherBurrito'), cls:'ghost', on:() => { newDraft(); editIndex = null; go('protein'); } },
    { html:t('addMore'), cls:'ghost', on:() => { draft = null; go('addons'); } },
    { html:`<span>${t('pay')}</span><small>${mxn(cartTotal())}</small>`, cls:'primary', split:true, disabled:!cart.length,
      on:() => go('name') },
  ]);
}

/* 6 · Name (before payment — the call-out name) */
function rName(app){
  const main = chrome(app, { kicker:t('nameK'), title:t('namePrompt'), step:0, backTo:'summary' });
  const wrap = document.createElement('div'); wrap.className = 'name-wrap';
  const rows = ['QWERTYUIOP', 'ASDFGHJKLÑ', 'ZXCVBNM'];
  wrap.innerHTML = `
    <p class="hint" style="margin:0">${t('nameHint')}</p>
    <div class="name-display">${customerName || ''}<span class="caret"></span></div>
    <div class="kb">
      ${rows.map(r => `<div class="kb-row">${[...r].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}</div>`).join('')}
      <div class="kb-row">
        <button class="key wide" data-k=" ">${t('space')}</button>
        <button class="key" data-k="⌫">⌫</button>
      </div>
    </div>`;
  main.appendChild(wrap);
  main.addEventListener('click', (ev) => {
    const key = ev.target.closest('[data-k]');
    if (!key) return;
    const k = key.dataset.k;
    if (k === '⌫') customerName = customerName.slice(0, -1);
    else if (customerName.length < 18) customerName += (k === ' ' ? ' ' : k);
    render();
  });
  const ready = customerName.trim().length >= 2;
  footerBtns(app, [{
    html:`<span>${t('payN')}</span><small>${mxn(cartTotal())}</small>`, cls:'primary', split:true, disabled:!ready,
    on:() => {
      toast(t('processing'));
      setTimeout(() => go('done'), 900);   // payment stub — real flow charges here
    },
  }]);
}

/* 7 · Done (after payment — call-out + loyalty QR) */
function rDone(app){
  const d = document.createElement('div'); d.className = 'done fade';
  d.innerHTML = `
    <div class="check">✓</div>
    <h1>${t('doneTitle').replace('{n}', customerName.trim())}</h1>
    <p class="call">📣 ${t('doneBody')}</p>
    <div class="loyalty-card">
      <div class="qr">${QR_SVG}</div>
      <div>
        <h3>⭐ ${t('loyaltyTitle')}</h3>
        <p>${t('loyaltyBody')}</p>
      </div>
    </div>
    <button class="btn ghost" id="newOrder" style="max-width:520px">${t('newOrder')}</button>`;
  app.appendChild(d);
  $('#newOrder').onclick = () => {
    cart = []; draft = null; customerName = ''; editIndex = null;
    go('attract');
  };
}

/* route alias for the drinks&sides jump */
const _go = go;
go = function(s){
  if (s === 'addons_only'){ draft = null; screen = 'addons'; render(); return; }
  _go(s);
};

render();
</script>
</body>
</html>
